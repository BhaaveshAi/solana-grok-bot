<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grok Bot - Perps</title>
    <style>
        body {
            background-color: #0b0e11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
        .badge-paper { background: #1a271b; color: #00e676; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; border: 1px solid #1e3a24; }
        .equity-section { margin-bottom: 16px; }
        .equity-title { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .equity-value { font-size: 2.2rem; font-weight: bold; margin: 2px 0; }
        .equity-gain { color: #00e676; font-size: 0.85rem; font-weight: 600; }
        .card { background-color: #151a21; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #21262d; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .pnl-amount { color: #00e676; font-size: 1.4rem; font-weight: bold; }
        .closes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .close-slot { background: #121e17; border: 1px solid #1e3a24; border-radius: 8px; padding: 10px; text-align: center; font-size: 0.75rem; color: #00e676; }
        .close-slot .sym { font-weight: bold; font-size: 0.85rem; color: #fff; }
        .tape-box { font-family: monospace; font-size: 0.75rem; color: #8b949e; max-height: 80px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🐼 Grok Bot</div>
        <div class="badge-paper">PAPER RUN</div>
    </div>

    <div class="equity-section">
        <div class="equity-title">Equity</div>
        <div class="equity-value" id="equity-val">$59.89</div>
        <div class="equity-gain" id="equity-gain">+$0.00</div>
    </div>

    <div class="card">
        <div class="card-header">
            <div>
                <span id="pos-symbol" style="font-weight:bold; font-size:1.1rem;">---</span>
                <span id="pos-side" style="font-size:0.75rem; padding:2px 6px; border-radius:4px; background:#1f2630; color:#8b949e;">---</span>
            </div>
            <div id="pos-pnl" class="pnl-amount">+$0.00</div>
        </div>
        <div style="font-size: 0.8rem; color: #8b949e;" id="pos-details">Initializing perp market feeds...</div>
    </div>

    <div class="card">
        <div style="font-size: 0.75rem; color: #8b949e; text-transform: uppercase; margin-bottom: 8px;">Big Closes</div>
        <div class="closes-grid" id="closes-grid">
            <div class="close-slot" style="background:#151a21; border-color:#21262d; color:#484f58;">?</div>
            <div class="close-slot" style="background:#151a21; border-color:#21262d; color:#484f58;">?</div>
            <div class="close-slot" style="background:#151a21; border-color:#21262d; color:#484f58;">?</div>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 0.75rem; color: #8b949e; text-transform: uppercase; margin-bottom: 6px;">Trade Tape</div>
        <div class="tape-box" id="trade-tape">Connecting to order stream...</div>
    </div>

    <script>
        async function refreshDashboard() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                document.getElementById('equity-val').innerText = `$${data.equity.toFixed(2)}`;
                const gain = data.equity - data.starting_equity;
                document.getElementById('equity-gain').innerText = `+$${gain.toFixed(2)}`;

                if (data.active_position) {
                    const pos = data.active_position;
                    document.getElementById('pos-symbol').innerText = `${pos.symbol} PERP`;
                    document.getElementById('pos-side').innerText = `${pos.side} ${pos.leverage}x`;
                    document.getElementById('pos-pnl').innerText = `+$${pos.unrealized_pnl.toFixed(2)}`;
                    document.getElementById('pos-details').innerText = `Entry: $${pos.entry_price} | Return: +${(pos.pnl_pct*100).toFixed(1)}%`;
                } else {
                    document.getElementById('pos-symbol').innerText = "SCANNING";
                    document.getElementById('pos-side').innerText = "IDLE";
                    document.getElementById('pos-pnl').innerText = "$0.00";
                    document.getElementById('pos-details').innerText = "Searching high-conviction perp setups...";
                }

                const grid = document.getElementById('closes-grid');
                if (data.big_closes.length > 0) {
                    grid.innerHTML = data.big_closes.slice(0, 3).map(c => `
                        <div class="close-slot">
                            <span class="sym">${c.symbol}</span><br>+$${c.profit.toFixed(0)}
                        </div>
                    `).join('');
                }

                const tape = document.getElementById('trade-tape');
                tape.innerHTML = data.trade_tape.slice(0, 3).join('<br>');

            } catch (err) {
                console.error(err);
            }
        }
        setInterval(refreshDashboard, 3000);
        refreshDashboard();
    </script>
</body>
</html>
