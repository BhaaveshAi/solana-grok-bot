<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grok Bot - Perps</title>
    <style>
        body {
            background-color: #0b0e11;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; }
        .status-badge { background: #1a2318; color: #00e676; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .equity-box { margin-bottom: 16px; }
        .equity-label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; }
        .equity-val { font-size: 2rem; font-weight: bold; }
        .equity-profit { color: #00e676; font-size: 0.9rem; }
        .card { background-color: #151a21; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px s #21262d; }
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .pnl-green { color: #00e676; font-size: 1.5rem; font-weight: bold; }
        .closes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .close-slot { background: #1f2630; border-radius: 8px; padding: 10px; text-align: center; font-size: 0.8rem; color: #8b949e; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🐼 Grok Bot</div>
        <div class="status-badge">PAPER RUN</div>
    </div>

    <div class="equity-box">
        <div class="equity-label">Equity</div>
        <div class="equity-val" id="equity-val">$59.89</div>
        <div class="equity-profit" id="equity-gain">+$0.00</div>
    </div>

    <div class="card" id="position-card">
        <div class="pos-header">
            <div>
                <span id="pos-symbol" style="font-weight:bold; font-size:1.1rem;">---</span>
                <span id="pos-side" style="font-size:0.8rem; padding:2px 6px; border-radius:4px; background:#22252a;">---</span>
            </div>
            <div id="pos-pnl" class="pnl-green">+$0.00</div>
        </div>
        <div style="font-size: 0.85rem; color: #8b949e;" id="pos-details">Waiting for execution setup...</div>
    </div>

    <div class="card">
        <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 8px;">Big Closes</div>
        <div class="closes-grid" id="closes-grid">
            <div class="close-slot">?</div>
            <div class="close-slot">?</div>
            <div class="close-slot">?</div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const res = await fetch('/api/state');
                const data = await res.json();
                
                document.getElementById('equity-val').innerText = `$${data.equity.toFixed(2)}`;
                const gain = data.equity - data.starting_equity;
                document.getElementById('equity-gain').innerText = `+$${gain.toFixed(2)}`;

                if (data.active_position) {
                    const pos = data.active_position;
                    document.getElementById('pos-symbol').innerText = `${pos.symbol} PERP`;
                    document.getElementById('pos-side').innerText = `${pos.side} ${pos.leverage}x`;
                    document.getElementById('pos-pnl').innerText = `+$${pos.unrealized_pnl.toFixed(2)}`;
                    document.getElementById('pos-details').innerText = `Entry: $${pos.entry_price} | Return: +${(pos.pnl_pct*100).toFixed(1)}%`;
                } else {
                    document.getElementById('pos-symbol').innerText = "SCANNING...";
                    document.getElementById('pos-side').innerText = "IDLE";
                    document.getElementById('pos-pnl').innerText = "$0.00";
                    document.getElementById('pos-details').innerText = "Analyzing perp order books...";
                }

                const grid = document.getElementById('closes-grid');
                if (data.big_closes.length > 0) {
                    grid.innerHTML = data.big_closes.slice(0, 3).map(c => `
                        <div class="close-slot" style="background:#13221a; color:#00e676;">
                            <b>${c.symbol}</b><br>+$${c.profit.toFixed(0)}
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }
        setInterval(updateDashboard, 3000);
        updateDashboard();
    </script>
</body>
</html>
